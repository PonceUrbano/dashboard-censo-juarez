<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Dashboard Demográfico - Cd. Juárez</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<style>
  :root { --bg:#143d2b; --bg2:#1e5238; --linea:#3b7a57; --acento:#9be3a8; --activo:#e3f26f; --texto:#eef7f0; }
  html, body { margin:0; padding:0; height:100%; }
  #map { position:absolute; top:0; bottom:0; width:100%; }

  /* Columna de menús, en orden: cabecera, Capas, Rangos, Radio, Manzana */
  #paneles { position:absolute; top:10px; left:10px; z-index:1; width:290px; display:flex; flex-direction:column;
    gap:8px; max-height:calc(100% - 52px); overflow-y:auto; font-family:Arial,sans-serif; color:var(--texto); scrollbar-width:thin; }
  .panel { background:var(--bg); border-radius:8px; box-shadow:0 4px 10px rgba(0,0,0,.3); flex-shrink:0; }
  .cabecera { padding:12px; }
  .cabecera h2 { font-size:15px; margin:0 0 10px; padding-bottom:6px; border-bottom:1px solid var(--acento); }
  .logo { background:#fff; border-radius:6px; padding:4px; margin-bottom:10px; text-align:center; }
  .logo img { display:block; margin:0 auto; width:150px; max-width:100%; height:auto; }

  details.panel > summary { cursor:pointer; padding:10px 12px; font-size:14px; font-weight:bold; color:var(--acento); }
  details.panel > summary:focus-visible { outline:2px solid var(--acento); outline-offset:-2px; }
  details.panel[open] > summary { border-bottom:1px solid var(--linea); }
  .contenido { padding:10px 12px 12px; }

  label { display:block; font-size:12px; opacity:.9; margin-bottom:4px; }
  label.check { display:flex; align-items:center; gap:8px; font-size:13px; opacity:1; cursor:pointer; margin:0; }
  input[type="checkbox"], input[type="range"] { accent-color:var(--acento); }
  input[type="range"] { width:100%; box-sizing:border-box; }
  select { width:100%; padding:5px; background:var(--bg2); color:var(--texto); border:1px solid var(--linea); border-radius:4px; font-size:12px; margin-bottom:8px; }
  .radio-controles { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .radio-controles input[type="range"] { flex:1; }
  .radio-controles input[type="number"] { width:70px; padding:4px 6px; background:var(--bg2); color:var(--texto);
    border:1px solid var(--linea); border-radius:4px; font-size:13px; text-align:center; }

  .modo { display:flex; gap:6px; }
  .modo button { flex:1; padding:6px 4px; background:var(--bg2); color:var(--texto); border:1px solid var(--linea); border-radius:4px; cursor:pointer; font-size:12px; }
  .modo button.activo { background:var(--acento); color:#0d2a1c; font-weight:bold; }

  .tabla-datos { width:100%; border-collapse:collapse; margin-top:6px; font-size:12px; }
  .tabla-datos td { padding:3px 4px; border-bottom:1px solid rgba(255,255,255,.1); }
  .tabla-datos td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  .tabla-datos tr[data-var] { cursor:pointer; }
  .tabla-datos tr[data-var]:hover td { background:rgba(155,227,168,.15); }
  .tabla-datos tr[data-var]:focus-visible { outline:2px solid var(--acento); outline-offset:-2px; }
  .tabla-datos tr.fila-activa td { color:var(--activo); font-weight:bold; }
  .tabla-datos tr.grupo td { padding-top:8px; font-size:11px; opacity:.75; border-bottom:0; color:var(--acento); }
  .resumen { font-size:12px; opacity:.85; margin:4px 0; }
  .id-manzana { font-size:12px; opacity:.85; word-break:break-all; margin:0 0 4px; }
  .menu-ayuda { opacity:.75; font-size:11px; margin:8px 0 0; }
  .leyenda-fila { display:flex; align-items:center; gap:6px; margin:3px 0; font-size:11px; }
  .leyenda-caja { width:14px; height:14px; border-radius:3px; flex-shrink:0; border:1px solid rgba(255,255,255,.25); }
</style>
</head>

<script>
let geojsonData = null;
let ultimoClickLngLat = null;
let manzanaSel = null;
let variableMapa = "POBTOT";
let modoClic = "manzana";   // "manzana", "radio" o null (ninguna): qué hace un clic en el mapa

const map = new maplibregl.Map({
  container: "map",
  style: "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",
  center: [-106.45, 31.68],
  zoom: 11,
});
map.addControl(new maplibregl.NavigationControl(), "top-right");

map.on("load", async () => {
  const resp = await fetch("manzanas_censo_tema1.geojson?v=" + Date.now());
  geojsonData = await resp.json();

  const configVariables = {
    POBTOT:      { label: "Población total",                 tipo: "suma",     grupo: "Población" },
    POBFEM_1:    { label: "Población femenina",              tipo: "suma",     grupo: "Población" },
    POBMAS_1:    { label: "Población masculina",             tipo: "suma",     grupo: "Población" },
    POB0_14_15:  { label: "Población 0-14 años",             tipo: "suma",     grupo: "Grupos de edad" },
    POB15_6_65:  { label: "Población 15-64 años",            tipo: "suma",     grupo: "Grupos de edad" },
    POB65_MA_1:  { label: "Población 65 años y más",         tipo: "suma",     grupo: "Grupos de edad" },
    GRAPROES_1:  { label: "Grado promedio de escolaridad",   tipo: "promedio", grupo: "Educación y empleo" },
    P15YM_AN_1:  { label: "Población analfabeta (15+)",      tipo: "suma",     grupo: "Educación y empleo" },
    PEA_1:       { label: "Población económicamente activa", tipo: "suma",     grupo: "Educación y empleo" },
    PDESOCUP_1:  { label: "Población desocupada",            tipo: "suma",     grupo: "Educación y empleo" },
    TVIVHAB_1:   { label: "Viviendas habitadas",             tipo: "suma",     grupo: "Vivienda y servicios" },
    PROM_OCU_1:  { label: "Ocupantes promedio por vivienda", tipo: "promedio", grupo: "Vivienda y servicios" },
    VPH_C_EL_1:  { label: "Viviendas con electricidad",      tipo: "suma",     grupo: "Vivienda y servicios" },
    VPH_AGUA_1:  { label: "Viviendas con agua entubada",     tipo: "suma",     grupo: "Vivienda y servicios" },
    VPH_DREN_1:  { label: "Viviendas con drenaje",           tipo: "suma",     grupo: "Vivienda y servicios" },
    VPH_INTE_1:  { label: "Viviendas con internet",          tipo: "suma",     grupo: "Vivienda y servicios" }
  };
  configVariables.GRAPROES_1.peso = "P_15YMAS_1";
  configVariables.PROM_OCU_1.peso = "TVIVHAB_1";

  geojsonData.features.forEach((f, i) => {
    f.properties.POBTOT = f.properties.POBTOT || 0;
    f.properties.POBFEM_1 = f.properties.POBFEM_1 || 0;
    f.properties.POBMAS_1 = f.properties.POBMAS_1 || 0;
    f.properties._id = i;
    f.properties.centroide = turf.centroid(f).geometry.coordinates;
  });

  map.addSource("manzanas", { type: "geojson", data: geojsonData });

  // Primera capa de tipo "symbol" del estilo base (nombres de ciudades, calles, etc.).
  // Insertamos nuestras capas justo antes, para que las etiquetas queden por encima.
  const primeraEtiqueta = map.getStyle().layers.find(l => l.type === "symbol");
  const antesDe = primeraEtiqueta ? primeraEtiqueta.id : undefined;

  // Cada variable tiene su propia rampa de 5 colores (bajo -> alto).
  // + gris verdoso para "sin dato / 0" en todas.
  const rampas = {
    POBTOT:      ["#ffffb2", "#fecc5c", "#fd8d3c", "#f03b20", "#bd0026"], // amarillo-naranja-rojo
    POBFEM_1:    ["#feebe2", "#fbb4b9", "#f768a1", "#c51b8a", "#7a0177"], // rosa-magenta
    POBMAS_1:    ["#eff3ff", "#bdd7e7", "#6baed6", "#3182bd", "#08519c"], // azules
    POB0_14_15:  ["#edf8e9", "#bae4b3", "#74c476", "#31a354", "#006d2c"], // verdes
    POB15_6_65:  ["#f2f0f7", "#cbc9e2", "#9e9ac8", "#756bb1", "#54278f"], // morados
    POB65_MA_1:  ["#edf8fb", "#b3cde3", "#8c96c6", "#8856a7", "#810f7c"], // azul-morado
    GRAPROES_1:  ["#ffffcc", "#a1dab4", "#41b6c4", "#2c7fb8", "#253494"], // amarillo-verde-azul
    P15YM_AN_1:  ["#f7f7f7", "#cccccc", "#969696", "#636363", "#252525"], // grises
    PEA_1:       ["#f0f9e8", "#bae4bc", "#7bccc4", "#43a2ca", "#0868ac"], // verde-azul
    PDESOCUP_1:  ["#fee5d9", "#fcae91", "#fb6a4a", "#de2d26", "#a50f15"], // rojos
    TVIVHAB_1:   ["#feedde", "#fdbe85", "#fd8d3c", "#e6550d", "#a63603"], // naranjas
    PROM_OCU_1:  ["#f6eff7", "#bdc9e1", "#67a9cf", "#1c9099", "#016c59"], // azul-verde
    VPH_C_EL_1:  ["#ffffd4", "#fed98e", "#fe9929", "#d95f0e", "#993404"], // amarillo-café
    VPH_AGUA_1:  ["#f1eef6", "#bdc9e1", "#74a9cf", "#2b8cbe", "#045a8d"], // azules (agua)
    VPH_DREN_1:  ["#fef0d9", "#fdcc8a", "#fc8d59", "#e34a33", "#b30000"], // naranja-rojo
    VPH_INTE_1:  ["#f1eef6", "#d4b9da", "#c994c7", "#df65b0", "#dd1c77"]  // rosa-morado
  };
  const colorSinDato = "#cfd8cf";

  // Redondea un corte a un número "limpio" para que la leyenda sea fácil de leer
  function redondearCorte(v, decimal) {
    if (decimal) return Math.round(v * 10) / 10;
    if (v < 10) return Math.round(v);
    if (v < 100) return Math.round(v / 5) * 5;
    if (v < 1000) return Math.round(v / 10) * 10;
    return Math.round(v / 100) * 100;
  }

  // Cortes por quintiles (20/40/60/80 %) redondeados y sin repetidos.
  // Devuelve los valores donde EMPIEZA cada clase a partir de la segunda.
  function calcularCortes(variable, decimal) {
    const valores = geojsonData.features
      .map(f => f.properties[variable])
      .filter(v => typeof v === "number" && isFinite(v) && v > 0)
      .sort((a, b) => a - b);
    if (!valores.length) return [];
    const min = valores[0];
    const crudos = [0.2, 0.4, 0.6, 0.8].map(p => valores[Math.min(Math.floor(p * valores.length), valores.length - 1)]);
    return [...new Set(crudos.map(v => redondearCorte(v, decimal)))]
      .filter(v => v > min)
      .sort((a, b) => a - b);
  }

  // Elige n colores de la rampa propia de la variable, según cuántas clases quedaron
  function coloresPara(n, ramp) {
    if (n <= 1) return [ramp[2]];
    return Array.from({ length: n }, (_, i) => ramp[Math.round(i * (ramp.length - 1) / (n - 1))]);
  }

  // Leyenda: rangos sin traslape (enteros: 1-29, 30-54...; promedios: menos de X, X-Y, X o más)
  function actualizarLeyenda(cortes, colores, decimal) {
    const f = n => decimal ? n.toLocaleString("es-MX", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) : n.toLocaleString("es-MX");
    const etiquetas = [];
    if (!cortes.length) {
      etiquetas.push("Mayor que 0");
    } else if (decimal) {
      etiquetas.push(`Menos de ${f(cortes[0])}`);
      for (let i = 0; i < cortes.length - 1; i++) etiquetas.push(`${f(cortes[i])} - ${f(cortes[i + 1])}`);
      etiquetas.push(`${f(cortes[cortes.length - 1])} o más`);
    } else {
      const rango = (a, b) => a >= b ? f(a) : `${f(a)} - ${f(b)}`;
      etiquetas.push(rango(1, cortes[0] - 1));
      for (let i = 0; i < cortes.length - 1; i++) etiquetas.push(rango(cortes[i], cortes[i + 1] - 1));
      etiquetas.push(`${f(cortes[cortes.length - 1])} o más`);
    }
    const filas = [{ color: colorSinDato, texto: "Sin dato / 0" }]
      .concat(etiquetas.map((t, i) => ({ color: colores[i], texto: t })));
    document.getElementById("leyenda-mapa").innerHTML = filas.map(r =>
      `<div class="leyenda-fila"><div class="leyenda-caja" style="background:${r.color}"></div>${r.texto}</div>`
    ).join("");
  }

  function generarExpresionColor(variable) {
    const decimal = configVariables[variable] && configVariables[variable].tipo === "promedio";
    const cortes = calcularCortes(variable, decimal);
    const ramp = rampas[variable] || rampas.POBTOT;
    const colores = coloresPara(cortes.length + 1, ramp);
    actualizarLeyenda(cortes, colores, decimal);
    const expr = ["step", ["to-number", ["get", variable], 0], colorSinDato, 0.0001, colores[0]];
    cortes.forEach((c, i) => expr.push(c, colores[i + 1]));
    return expr;
  }

  map.addSource("circulo-busqueda", { type: "geojson", data: turf.featureCollection([]) });
  map.addSource("manzana-seleccionada", { type: "geojson", data: turf.featureCollection([]) });

  // Sin filtro: las manzanas con 0 se ven en el color "sin dato" de la leyenda
  map.addLayer({
    id: "manzanas-fill", type: "fill", source: "manzanas",
    paint: { "fill-color": generarExpresionColor("POBTOT"), "fill-opacity": 0.55 }
   }, antesDe);
  map.addLayer({
    id: "manzanas-hit", type: "fill", source: "manzanas",
    paint: { "fill-color": "#000000", "fill-opacity": 0 }
   }, antesDe);
  map.addLayer({
    id: "manzanas-linea", type: "line", source: "manzanas",
    paint: { "line-color": "#555", "line-width": 0.3, "line-opacity": 0.3 }
   }, antesDe);
  map.addLayer({
    id: "circulo-layer-fill", type: "fill", source: "circulo-busqueda",
    paint: { "fill-color": "#22c55e", "fill-opacity": 0.15 }
   }, antesDe);
  map.addLayer({
    id: "circulo-layer-stroke", type: "line", source: "circulo-busqueda",
    paint: { "line-color": "#22c55e", "line-width": 2, "line-dasharray": [2, 2] }
   }, antesDe);
  map.addLayer({
    id: "seleccion-fill", type: "fill", source: "manzana-seleccionada",
    paint: { "fill-color": "#38bdf8", "fill-opacity": 0.35 }
   }, antesDe);
  map.addLayer({
    id: "seleccion-stroke", type: "line", source: "manzana-seleccionada",
    paint: { "line-color": "#0ea5e9", "line-width": 3 }
   }, antesDe);

  const bounds = new maplibregl.LngLatBounds();
  geojsonData.features.forEach(f => {
    const coords = f.geometry.type === "MultiPolygon" ? f.geometry.coordinates.flat(2) : f.geometry.coordinates.flat(1);
    coords.forEach(([lng, lat]) => bounds.extend([lng, lat]));
  });
  map.fitBounds(bounds, { padding: 20 });

  function formatearValor(v, tipo) {
    if (v === undefined || v === null || v === "") return "Sin dato";
    if (tipo === "promedio" && v === 0) return "Sin dato";
    if (typeof v === "number" && isFinite(v)) {
      return tipo === "promedio"
        ? v.toLocaleString(undefined, { maximumFractionDigits: 2 })
        : v.toLocaleString();
    }
    return String(v);
  }

  function dibujarTabla(idTabla, obtenerValor) {
    let html = "";
    let grupoActual = "";
    Object.entries(configVariables).forEach(([clave, cfg]) => {
      if (cfg.grupo !== grupoActual) {
        grupoActual = cfg.grupo;
        html += `<tr class="grupo"><td colspan="2">${grupoActual}</td></tr>`;
      }
      html += `<tr data-var="${clave}" tabindex="0" title="Colorear el mapa con esta variable" ` +
              `class="${clave === variableMapa ? "fila-activa" : ""}">` +
              `<td>${cfg.label}</td><td>${obtenerValor(clave, cfg)}</td></tr>`;
    });
    document.getElementById(idTabla).innerHTML = html;
  }

  function agregarVariable(manzanas, variable, cfg) {
    let suma = 0, peso = 0, n = 0;
    manzanas.forEach(f => {
      const v = f.properties[variable];
      if (typeof v !== "number" || !isFinite(v)) return;
      if (cfg.tipo === "promedio") {
        const w = cfg.peso ? f.properties[cfg.peso] : 1;
        if (typeof w === "number" && w > 0) { suma += v * w; peso += w; n++; }
      } else {
        suma += v; n++;
      }
    });
    if (n === 0) return null;
    return cfg.tipo === "promedio" ? suma / peso : suma;
  }

  function ejecutarAnalisisEspacial(lngLat) {
    if (!geojsonData) return;
    ultimoClickLngLat = lngLat;
    const radioMetros = parseFloat(document.getElementById("radio-num").value) || 1000;
    const circuloGeo = turf.buffer(turf.point([lngLat.lng, lngLat.lat]), radioMetros / 1000, { units: "kilometers" });
    map.getSource("circulo-busqueda").setData(circuloGeo);

    const dentro = geojsonData.features.filter(f =>
      turf.booleanPointInPolygon(turf.point(f.properties.centroide), circuloGeo)
    );
    const valores = {};
    Object.entries(configVariables).forEach(([clave, cfg]) => {
      valores[clave] = agregarVariable(dentro, clave, cfg);
    });
    document.getElementById("resumen-radio").textContent =
      `${dentro.length.toLocaleString()} manzanas en un radio de ${radioMetros.toLocaleString()} m`;
    dibujarTabla("tabla-radio", (clave, cfg) => formatearValor(valores[clave], cfg.tipo));
  }

  function mostrarManzana() {
    if (!manzanaSel) return;
    const props = manzanaSel.properties;
    const claveId = ["CveGeo", "CVEGEO", "CVE_GEO", "CVE_MZA", "MANZANA"].find(k => props[k] !== undefined && props[k] !== null);
    document.getElementById("id-manzana").textContent = claveId ? `Clave: ${props[claveId]}` : `Manzana n.º ${props._id + 1}`;
    dibujarTabla("tabla-manzana", (clave, cfg) => formatearValor(props[clave], cfg.tipo));
  }

  function limpiarManzana() {
    manzanaSel = null;
    map.getSource("manzana-seleccionada").setData(turf.featureCollection([]));
    document.getElementById("id-manzana").textContent = "Ninguna. Haz clic en una manzana.";
    dibujarTabla("tabla-manzana", () => "-");
  }

  function seleccionarManzana(punto) {
    const encontradas = map.queryRenderedFeatures(punto, { layers: ["manzanas-hit"] });
    if (!encontradas.length) { limpiarManzana(); return; }
    manzanaSel = geojsonData.features[encontradas[0].properties._id];
    map.getSource("manzana-seleccionada").setData(turf.feature(manzanaSel.geometry));
    mostrarManzana();
  }

  function colorearMapaPor(variable) {
    variableMapa = variable;
    map.setPaintProperty("manzanas-fill", "fill-color", generarExpresionColor(variable));
    const cfg = configVariables[variable];
    document.getElementById("sel-variable").value = variable;
    document.querySelectorAll(".tabla-datos tr[data-var]").forEach(tr => {
      tr.classList.toggle("fila-activa", tr.dataset.var === variable);
    });
  }

  // Un clic hace UNA sola cosa según el modo elegido: ver manzana o calcular radio
  function limpiarRadio() {
    ultimoClickLngLat = null;
    map.getSource("circulo-busqueda").setData(turf.featureCollection([]));
    document.getElementById("resumen-radio").textContent = "Haz clic en el mapa para calcular el radio.";
    dibujarTabla("tabla-radio", () => "-");
  }

  function cambiarModo(modo, abrirMenu) {
    if (abrirMenu === undefined) abrirMenu = true;
    modoClic = modo;
    document.getElementById("modo-manzana").classList.toggle("activo", modo === "manzana");
    document.getElementById("modo-radio").classList.toggle("activo", modo === "radio");
    if (modo !== "manzana") limpiarManzana();
    if (modo !== "radio") limpiarRadio();
    if (abrirMenu && modo === "radio") document.getElementById("menu-radio").open = true;
    if (abrirMenu && modo === "manzana") document.getElementById("menu-manzana").open = true;
    map.getCanvas().style.cursor = modo === "radio" ? "crosshair" : modo === "manzana" ? "pointer" : "";
  }

  map.on("click", (e) => {
    if (modoClic === "radio") ejecutarAnalisisEspacial(e.lngLat);
    else if (modoClic === "manzana") seleccionarManzana(e.point);
  });

  document.getElementById("modo-manzana").addEventListener("click", () => cambiarModo(modoClic === "manzana" ? null : "manzana"));
  document.getElementById("modo-radio").addEventListener("click", () => cambiarModo(modoClic === "radio" ? null : "radio"));

  // Encender / apagar la capa de manzanas (la capa invisible de clic se mantiene)
  document.getElementById("chk-manzanas").addEventListener("change", (e) => {
    const v = e.target.checked ? "visible" : "none";
    ["manzanas-fill", "manzanas-linea"].forEach(id => map.setLayoutProperty(id, "visibility", v));
  });

  // Selector de variable (menú Rangos)
  const selVar = document.getElementById("sel-variable");
  selVar.innerHTML = Object.entries(configVariables).map(([k, c]) => `<option value="${k}">${c.label}</option>`).join("");
  selVar.addEventListener("change", () => colorearMapaPor(selVar.value));

  document.getElementById("radio").addEventListener("input", (e) => {
    document.getElementById("radio-num").value = e.target.value;
    if (ultimoClickLngLat) ejecutarAnalisisEspacial(ultimoClickLngLat);
  });

  document.getElementById("radio-num").addEventListener("input", (e) => {
    const valor = parseFloat(e.target.value);
    if (!isNaN(valor)) {
      const slider = document.getElementById("radio");
      if (valor >= parseFloat(slider.min) && valor <= parseFloat(slider.max)) slider.value = valor;
      if (ultimoClickLngLat) ejecutarAnalisisEspacial(ultimoClickLngLat);
    }
  });

  const paneles = document.getElementById("paneles");
  paneles.addEventListener("click", (e) => {
    const fila = e.target.closest("tr[data-var]");
    if (fila) colorearMapaPor(fila.dataset.var);
  });
  paneles.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const fila = e.target.closest("tr[data-var]");
    if (fila) { e.preventDefault(); colorearMapaPor(fila.dataset.var); }
  });

  limpiarManzana();
  limpiarRadio();
  cambiarModo("manzana", false);

  // Botón para mostrar/ocultar todo el bloque de menús. Oculto por defecto SOLO
  // en pantallas angostas (celular), para que el mapa no quede tapado al abrir.
  const togglePaneles = document.getElementById("toggle-paneles");
  const bloquePaneles = document.getElementById("paneles");
  const esPantallaAngosta = window.matchMedia("(max-width: 640px)");
  function ajustarPanelesSegunPantalla() {
    bloquePaneles.classList.toggle("oculto", esPantallaAngosta.matches);
  }
  ajustarPanelesSegunPantalla();
  esPantallaAngosta.addEventListener("change", ajustarPanelesSegunPantalla);
  togglePaneles.addEventListener("click", () => bloquePaneles.classList.toggle("oculto"));
});
</script>

</body>
</html>
