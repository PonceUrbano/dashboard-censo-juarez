<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Dashboard Demográfico - Cd. Juárez</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- MapLibre GL JS: CDN oficial en la nube (evita usar archivos locales pesados) -->
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />

<!-- Turf.js: Librería de operaciones espaciales para el círculo y las sumas en tiempo real -->
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  #map { position: absolute; top: 0; bottom: 0; width: 100%; }

  /* Panel lateral de resultados */
  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 1;
    background: #14213d; color: white; padding: 16px;
    border-radius: 8px; width: 280px; font-family: Arial, sans-serif;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    max-height: calc(100% - 52px); overflow-y: auto;
  }
  #panel h2 { font-size: 16px; margin: 0 0 12px; border-bottom: 1px solid #fca311; padding-bottom: 6px; }
  #panel p { margin: 6px 0; font-size: 14px; }
  #panel .control-group { margin-bottom: 12px; }
  #panel label { font-size: 12px; opacity: 0.9; display: block; margin-bottom: 4px; }
  #panel input[type="range"] { width: 100%; box-sizing: border-box; }
  .radio-controles { display: flex; align-items: center; gap: 8px; }
  .radio-controles input[type="range"] { flex: 1; }
  .radio-controles input[type="number"] {
    width: 70px; padding: 4px 6px; background: #1c2a4a; color: white;
    border: 1px solid #4a5568; border-radius: 4px; font-size: 13px; text-align: center;
  }

  /* Logo */
  .logo { background: #fff; border-radius: 6px; padding: 6px 8px; margin-bottom: 12px; text-align: center; }
  .logo img { display: block; margin: 0 auto; width: 190px; max-width: 100%; height: auto; }

  /* Tablas de datos (Radio y Manzana): cada fila colorea el mapa con esa variable */
  .tabla-datos { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
  .tabla-datos td { padding: 3px 4px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .tabla-datos td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .tabla-datos tr[data-var] { cursor: pointer; }
  .tabla-datos tr[data-var]:hover td { background: rgba(255,255,255,0.07); }
  .tabla-datos tr[data-var]:focus-visible { outline: 2px solid #38bdf8; outline-offset: -2px; }
  .tabla-datos tr.fila-activa td { color: #fca311; font-weight: bold; }
  .tabla-datos tr.grupo td { padding-top: 8px; font-size: 11px; opacity: 0.7; border-bottom: 0; }
  .resumen { font-size: 12px; opacity: .8; margin: 4px 0; }
  .id-manzana { font-size: 12px; opacity: 0.8; word-break: break-all; margin: 4px 0; }

  /* Leyenda de colores del mapa */
  #leyenda-mapa { margin-top: 6px; }
  .menu-ayuda { opacity: .7; font-size: 11px; margin-top: 12px; }

  /* Menús desplegables (Radio / Manzana) */
  #panel details.menu { border-top: 1px solid rgba(255,255,255,0.15); padding-top: 10px; margin-top: 8px; }
  #panel details.menu > summary { cursor: pointer; font-size: 15px; font-weight: bold; color: #fca311; margin-bottom: 10px; }
  #panel details.menu > summary:focus-visible { outline: 2px solid #38bdf8; outline-offset: 2px; }
  .leyenda-fila { display: flex; align-items: center; gap: 6px; margin: 3px 0; font-size: 11px; opacity: 0.9; }
  .leyenda-caja { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
</style>
</head>

const map = new maplibregl.Map({
  container: "map",
  style: "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
  center: [-106.45, 31.68], 
  zoom: 11,
});

map.addControl(new maplibregl.NavigationControl(), "top-right");

map.on("load", async () => {
  // Cache-busting: evita que el navegador use una copia vieja del geojson en memoria/disco
  const resp = await fetch("manzanas_censo_tema1.geojson?v=" + Date.now());
  geojsonData = await resp.json();

  console.log(Object.keys(geojsonData.features[0].properties));

  // Configuración de cada variable: etiqueta legible y si se debe SUMAR (conteos) o PROMEDIAR (tasas/promedios)
  const configVariables = {
    POBTOT:      { label: "Población total",                      tipo: "suma",     grupo: "Población" },
    POBFEM_1:    { label: "Población femenina",                   tipo: "suma",     grupo: "Población" },
    POBMAS_1:    { label: "Población masculina",                  tipo: "suma",     grupo: "Población" },
    POB0_14_15:  { label: "Población 0-14 años",                  tipo: "suma",     grupo: "Grupos de edad" },
    POB15_6_65:  { label: "Población 15-64 años",                 tipo: "suma",     grupo: "Grupos de edad" },
    POB65_MA_1:  { label: "Población 65 años y más",              tipo: "suma",     grupo: "Grupos de edad" },
    GRAPROES_1:  { label: "Grado promedio de escolaridad",        tipo: "promedio", grupo: "Educación y empleo" },
    P15YM_AN_1:  { label: "Población analfabeta (15+)",           tipo: "suma",     grupo: "Educación y empleo" },
    PEA_1:       { label: "Población económicamente activa",      tipo: "suma",     grupo: "Educación y empleo" },
    PDESOCUP_1:  { label: "Población desocupada",                 tipo: "suma",     grupo: "Educación y empleo" },
    TVIVHAB_1:   { label: "Viviendas habitadas",                  tipo: "suma",     grupo: "Vivienda y servicios" },
    PROM_OCU_1:  { label: "Ocupantes promedio por vivienda",      tipo: "promedio", grupo: "Vivienda y servicios" },
    VPH_C_EL_1:  { label: "Viviendas con electricidad",           tipo: "suma",     grupo: "Vivienda y servicios" },
    VPH_AGUA_1:  { label: "Viviendas con agua entubada",          tipo: "suma",     grupo: "Vivienda y servicios" },
    VPH_DREN_1:  { label: "Viviendas con drenaje",                tipo: "suma",     grupo: "Vivienda y servicios" },
    VPH_INTE_1:  { label: "Viviendas con internet",               tipo: "suma",     grupo: "Vivienda y servicios" }
  };

  // Variables tipo promedio: se ponderan por la población a la que se refieren, para que una manzana
  // con 3 viviendas no pese lo mismo que una con 80 (y las manzanas vacías no bajen el promedio).
  configVariables.GRAPROES_1.peso = "P_15YMAS_1";   // escolaridad: personas de 15 años y más
  configVariables.PROM_OCU_1.peso = "TVIVHAB_1";    // ocupantes por vivienda: viviendas habitadas

  // Asegurar que valores nulos o indefinidos sean 0 para evitar errores en las sumas
  geojsonData.features.forEach((f, i) => {
    f.properties.POBTOT = f.properties.POBTOT || 0;
    f.properties.POBFEM_1 = f.properties.POBFEM_1 || 0;
    f.properties.POBMAS_1 = f.properties.POBMAS_1 || 0;

    // Índice interno: permite recuperar la manzana original a partir de lo que devuelve el mapa al hacer clic
    f.properties._id = i;

    // Calculamos el centroide de cada manzana una sola vez para agilizar el análisis espacial
    f.properties.centroide = turf.centroid(f).geometry.coordinates;
  });

  map.addSource("manzanas", { type: "geojson", data: geojsonData });

  // Paleta secuencial cálida (4 clases, de bajo a alto) + color neutro para "0 / sin dato"
  const paletaSecuencial = ["#ffeda0", "#fd8d3c", "#f03b20", "#bd0026"];
  const colorSinDato = "#3d4a63";

  // Calcula 3 puntos de corte que dividen los valores POSITIVOS de una variable en 4 grupos
  // con cantidades similares de manzanas (clasificación por cuartiles), en vez de una escala
  // lineal por el máximo (que con datos de censo, muy sesgados, deja casi todo del mismo color).
  function calcularCuartiles(variable) {
    const valores = geojsonData.features
      .map(f => f.properties[variable])
      .filter(v => typeof v === "number" && isFinite(v) && v > 0)
      .sort((a, b) => a - b);

    if (valores.length === 0) return [1, 2, 3];

    const cortes = [0.25, 0.5, 0.75].map(pct => {
      const idx = Math.min(Math.floor(pct * valores.length), valores.length - 1);
      return valores[idx];
    });

    // Evitar cortes duplicados cuando hay muchos valores repetidos (ej. variables binarias)
    for (let i = 1; i < cortes.length; i++) {
      if (cortes[i] <= cortes[i - 1]) cortes[i] = cortes[i - 1] + 0.01;
    }
    return cortes;
  }

  // Dibuja la leyenda visual (cajitas de color + rango de cada clase) en el panel
  function actualizarLeyenda(cortes) {
    const [b1, b2, b3] = cortes;
    const formato = n => (Number.isInteger(n) ? n.toLocaleString() : n.toFixed(1));
    const filas = [
      { color: colorSinDato, texto: "Sin dato / 0" },
      { color: paletaSecuencial[0], texto: `0 - ${formato(b1)}` },
      { color: paletaSecuencial[1], texto: `${formato(b1)} - ${formato(b2)}` },
      { color: paletaSecuencial[2], texto: `${formato(b2)} - ${formato(b3)}` },
      { color: paletaSecuencial[3], texto: `${formato(b3)} +` }
    ];
    document.getElementById("leyenda-mapa").innerHTML = filas.map(f =>
      `<div class="leyenda-fila"><div class="leyenda-caja" style="background:${f.color}"></div>${f.texto}</div>`
    ).join("");
  }

  // Genera la expresión de color de MapLibre por clasificación de cuartiles (clases discretas,
  // no gradiente), y actualiza la leyenda visual al mismo tiempo.
  function generarExpresionColor(variable) {
    const [b1, b2, b3] = calcularCuartiles(variable);
    actualizarLeyenda([b1, b2, b3]);
    return [
      "step", ["coalesce", ["get", variable], 0],
      colorSinDato,
      0.0001, paletaSecuencial[0],
      b1, paletaSecuencial[1],
      b2, paletaSecuencial[2],
      b3, paletaSecuencial[3]
    ];
  }

  // Source para dibujar el círculo de búsqueda en tiempo real
  map.addSource("circulo-busqueda", {
    type: "geojson",
    data: turf.featureCollection([])
  });

  // Source para resaltar la manzana seleccionada
  map.addSource("manzana-seleccionada", {
    type: "geojson",
    data: turf.featureCollection([])
  });

  // Capa de relleno para las manzanas (Coroplético por POBTOT por defecto)
  map.addLayer({
    id: "manzanas-fill",
    type: "fill",
    source: "manzanas",
    filter: [">", ["get", "POBTOT"], 0],
    paint: {
      "fill-color": generarExpresionColor("POBTOT"),
      "fill-opacity": 0.6
    }
  });

  // Capa invisible con TODAS las manzanas (incluidas las de población 0, que la capa de
  // arriba filtra). Sirve solo para detectar el clic en cualquier manzana.
  map.addLayer({
    id: "manzanas-hit",
    type: "fill",
    source: "manzanas",
    paint: { "fill-color": "#000000", "fill-opacity": 0 }
  });

  // Bordes discretos de las manzanas
  map.addLayer({
    id: "manzanas-linea",
    type: "line",
    source: "manzanas",
    paint: { "line-color": "#555", "line-width": 0.3, "line-opacity": 0.3 }
  });

  // Capas del círculo de análisis (Relleno y borde)
  map.addLayer({
    id: "circulo-layer-fill",
    type: "fill",
    source: "circulo-busqueda",
    paint: { "fill-color": "#38bdf8", "fill-opacity": 0.15 }
  });

  map.addLayer({
    id: "circulo-layer-stroke",
    type: "line",
    source: "circulo-busqueda",
    paint: { "line-color": "#38bdf8", "line-width": 2, "line-dasharray": [2, 2] }
  });

  // Capas de la manzana seleccionada (relleno y borde marcado)
  map.addLayer({
    id: "seleccion-fill",
    type: "fill",
    source: "manzana-seleccionada",
    paint: { "fill-color": "#38bdf8", "fill-opacity": 0.35 }
  });

  map.addLayer({
    id: "seleccion-stroke",
    type: "line",
    source: "manzana-seleccionada",
    paint: { "line-color": "#0ea5e9", "line-width": 3 }
  });

  // Ajustar la vista del mapa automáticamente a la extensión del GeoJSON
  const bounds = new maplibregl.LngLatBounds();
  geojsonData.features.forEach(f => {
    const coords = f.geometry.type === "MultiPolygon" ? f.geometry.coordinates.flat(2) : f.geometry.coordinates.flat(1);
    coords.forEach(([lng, lat]) => bounds.extend([lng, lat]));
  });
  map.fitBounds(bounds, { padding: 20 });

  // -----------------------------------------------------------------
  // Utilidades de las tablas (Radio y Manzana)
  // -----------------------------------------------------------------

  // Formatea un valor. Si el censo trae texto (ej. "*" por confidencialidad) lo muestra tal cual.
  function formatearValor(v, tipo) {
    if (v === undefined || v === null || v === "") return "Sin dato";
    if (tipo === "promedio" && v === 0) return "Sin dato";
    if (typeof v === "number" && isFinite(v)) {
      return tipo === "promedio"
        ? v.toLocaleString(undefined, { maximumFractionDigits: 2 })
        : v.toLocaleString();
    }
    return String(v);
  }

  // Dibuja una tabla con las 16 variables agrupadas. obtenerValor(clave, cfg) devuelve el texto de cada fila.
  // Las filas son botones: al hacer clic colorean el mapa con esa variable.
  function dibujarTabla(idTabla, obtenerValor) {
    let html = "";
    let grupoActual = "";
    Object.entries(configVariables).forEach(([clave, cfg]) => {
      if (cfg.grupo !== grupoActual) {
        grupoActual = cfg.grupo;
        html += `<tr class="grupo"><td colspan="2">${grupoActual}</td></tr>`;
      }
      html += `<tr data-var="${clave}" tabindex="0" title="Colorear el mapa con esta variable" ` +
              `class="${clave === variableMapa ? "fila-activa" : ""}">` +
              `<td>${cfg.label}</td><td>${obtenerValor(clave, cfg)}</td></tr>`;
    });
    document.getElementById(idTabla).innerHTML = html;
  }

  // -----------------------------------------------------------------
  // RADIO: genera el círculo y agrega las 16 variables de las manzanas dentro de él
  // -----------------------------------------------------------------

  // Suma (o promedio ponderado) de una variable sobre un conjunto de manzanas. null si no hay dato.
  function agregarVariable(manzanas, variable, cfg) {
    let suma = 0, peso = 0, n = 0;
    manzanas.forEach(f => {
      const v = f.properties[variable];
      if (typeof v !== "number" || !isFinite(v)) return;
      if (cfg.tipo === "promedio") {
        const w = cfg.peso ? f.properties[cfg.peso] : 1;
        if (typeof w === "number" && w > 0) { suma += v * w; peso += w; n++; }
      } else {
        suma += v; n++;
      }
    });
    if (n === 0) return null;
    return cfg.tipo === "promedio" ? suma / peso : suma;
  }

  function ejecutarAnalisisEspacial(lngLat) {
    if (!geojsonData) return;

    ultimoClickLngLat = lngLat;
    const radioMetros = parseFloat(document.getElementById("radio-num").value) || 1000;
    const puntoCentro = turf.point([lngLat.lng, lngLat.lat]);

    // 1. Crear la geometría poligonal del círculo usando Turf.js (metros -> km para la unidad que pide turf.buffer)
    const circuloGeo = turf.buffer(puntoCentro, radioMetros / 1000, { units: "kilometers" });
    map.getSource("circulo-busqueda").setData(circuloGeo);

    // 2. Manzanas cuyo centroide cae dentro del círculo
    const dentro = geojsonData.features.filter(f =>
      turf.booleanPointInPolygon(turf.point(f.properties.centroide), circuloGeo)
    );

    // 3. Agregar todas las variables y mostrarlas en la tabla
    const valores = {};
    Object.entries(configVariables).forEach(([clave, cfg]) => {
      valores[clave] = agregarVariable(dentro, clave, cfg);
    });

    document.getElementById("resumen-radio").textContent =
      `${dentro.length.toLocaleString()} manzanas en un radio de ${radioMetros.toLocaleString()} m`;
    dibujarTabla("tabla-radio", (clave, cfg) => formatearValor(valores[clave], cfg.tipo));
  }

  // -----------------------------------------------------------------
  // MANZANA: selecciona una manzana individual y muestra sus datos
  // -----------------------------------------------------------------
  function mostrarManzana() {
    if (!manzanaSel) return;
    const props = manzanaSel.properties;

    // Identificador de la manzana, si el GeoJSON trae alguna clave conocida
    const claveId = ["CveGeo", "CVEGEO", "CVE_GEO", "CVE_MZA", "MANZANA"].find(k => props[k] !== undefined && props[k] !== null);
    document.getElementById("id-manzana").textContent = claveId ? `Clave: ${props[claveId]}` : `Manzana n.º ${props._id + 1}`;

    dibujarTabla("tabla-manzana", (clave, cfg) => formatearValor(props[clave], cfg.tipo));
  }

  function limpiarManzana() {
    manzanaSel = null;
    map.getSource("manzana-seleccionada").setData(turf.featureCollection([]));
    document.getElementById("id-manzana").textContent = "Ninguna. Haz clic en una manzana.";
    dibujarTabla("tabla-manzana", () => "-");
  }

  function seleccionarManzana(punto) {
    const encontradas = map.queryRenderedFeatures(punto, { layers: ["manzanas-hit"] });
    if (!encontradas.length) {
      limpiarManzana();
      return;
    }
    // Recuperamos la manzana original (geometría completa, sin recortes por teselas)
    manzanaSel = geojsonData.features[encontradas[0].properties._id];
    map.getSource("manzana-seleccionada").setData(turf.feature(manzanaSel.geometry));
    mostrarManzana();
  }

  // Colorea el mapa con la variable indicada, actualiza el título y la leyenda,
  // y resalta esa fila en las dos tablas
  function colorearMapaPor(variable) {
    variableMapa = variable;
    map.setPaintProperty("manzanas-fill", "fill-color", generarExpresionColor(variable));
    const cfg = configVariables[variable];
    document.getElementById("mapa-variable-etiqueta").textContent = cfg ? cfg.label : variable;
    document.querySelectorAll(".tabla-datos tr[data-var]").forEach(tr => {
      tr.classList.toggle("fila-activa", tr.dataset.var === variable);
    });
  }

  // Un clic en el mapa hace las dos cosas: calcula el radio alrededor del punto
  // y selecciona la manzana que quedó bajo el clic
  map.on("click", (e) => {
    ejecutarAnalisisEspacial(e.lngLat);
    seleccionarManzana(e.point);
  });

  // Escuchar cambios en el slider (metros) -> refleja el valor en el input numérico
  document.getElementById("radio").addEventListener("input", (e) => {
    document.getElementById("radio-num").value = e.target.value;
    if (ultimoClickLngLat) {
      ejecutarAnalisisEspacial(ultimoClickLngLat);
    }
  });

  // Escuchar cambios en el input numérico (metros) -> refleja el valor en el slider
  document.getElementById("radio-num").addEventListener("input", (e) => {
    const valor = parseFloat(e.target.value);
    if (!isNaN(valor)) {
      // Si el valor cabe en el rango del slider, lo sincroniza también
      const slider = document.getElementById("radio");
      if (valor >= parseFloat(slider.min) && valor <= parseFloat(slider.max)) {
        slider.value = valor;
      }
      if (ultimoClickLngLat) {
        ejecutarAnalisisEspacial(ultimoClickLngLat);
      }
    }
  });

  // Clic (o Enter / Espacio) en una fila de cualquiera de las tablas: colorea el mapa con esa variable
  const panel = document.getElementById("panel");
  panel.addEventListener("click", (e) => {
    const fila = e.target.closest("tr[data-var]");
    if (fila) colorearMapaPor(fila.dataset.var);
  });
  panel.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const fila = e.target.closest("tr[data-var]");
    if (fila) {
      e.preventDefault();
      colorearMapaPor(fila.dataset.var);
    }
  });

  // Estado inicial: tablas con guiones hasta que se haga el primer clic
  dibujarTabla("tabla-radio", () => "-");
  limpiarManzana();
  map.getCanvas().style.cursor = "crosshair";
});
</script>

</body>
</html>
